<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에이전트 코드 손풀기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{
  /* 레이아웃: 책상 위에 VS Code 창 하나 — 활동 막대 · 탐색기 · 편집기(탭·경로·코드) · 패널 · 상태 표시줄.
     기본은 VS Code 기본 테마(Dark Modern), 설정에서 Light Modern으로 바꿀 수 있다. */
  color-scheme: dark;
  --desk:#0e1013;
  --chrome:#181818; --editor:#1f1f1f; --border:#2b2b2b;
  --fg:#cccccc; --fg-strong:#e7e7e7; --fg-dim:#9d9d9d; --fg-faint:#6e7681;
  --accent:#0078d4; --accent-fg:#4daafc; --on-accent:#ffffff;
  --list-hover:#2a2d2e; --list-active:#37373d; --focus:#0078d4;
  --widget:#202020; --widget-border:#454545; --shadow:rgba(0,0,0,.45);
  --peek:#16202c; --peek-head:#1e2a38; --peek-border:#3794ff;
  --input:#313131; --input-border:#3c3c3c;
  --btn:#0078d4; --btn-hover:#026ec1; --btn2:#313131; --btn2-hover:#3c3c3c;
  --err:#f14c4c; --err-soft:rgba(241,76,76,.15); --warn:#cca700; --warn-soft:rgba(204,167,0,.14);
  --info:#3794ff; --info-soft:rgba(55,148,255,.13); --ok:#2ea043; --ok-fg:#73c991; --ok-soft:rgba(46,160,67,.16);
  --cur-line:#282828; --ln:#6e7681; --ln-active:#cccccc; --indent:#333333; --ghost:#5f5f5f; --sel:#264f78;
  --s-kw:#569cd6; --s-ctrl:#c586c0; --s-str:#ce9178; --s-esc:#d7ba7d; --s-com:#6a9955; --s-num:#b5cea8;
  --s-fn:#dcdcaa; --s-cls:#4ec9b0; --s-var:#9cdcfe; --s-const:#4fc1ff; --s-op:#cccccc;
  --br0:#ffd700; --br1:#da70d6; --br2:#179fff;
  --star:#e2c08d; --remote:#0078d4;
  --font-ui:-apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-code:Menlo, Monaco, Consolas, "Nanum Gothic Coding", "D2Coding", "Courier New", monospace;
  --code-size:14px; --code-lh:21px; --gut:66px; --vw:800px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --desk:#d5d9df;
  --chrome:#f8f8f8; --editor:#ffffff; --border:#e5e5e5;
  --fg:#3b3b3b; --fg-strong:#1f1f1f; --fg-dim:#616161; --fg-faint:#8b949e;
  --accent:#005fb8; --accent-fg:#005fb8; --on-accent:#ffffff;
  --list-hover:#f2f2f2; --list-active:#e4e6f1; --focus:#005fb8;
  --widget:#f8f8f8; --widget-border:#c8c8c8; --shadow:rgba(0,0,0,.16);
  --peek:#f2f8fc; --peek-head:#e6f0f9; --peek-border:#1a85ff;
  --input:#ffffff; --input-border:#cecece;
  --btn:#005fb8; --btn-hover:#0258a8; --btn2:#e5e5e5; --btn2-hover:#cccccc;
  --err:#e51400; --err-soft:rgba(229,20,0,.09); --warn:#bf8803; --warn-soft:rgba(191,136,3,.12);
  --info:#1a85ff; --info-soft:rgba(26,133,255,.1); --ok:#2ea043; --ok-fg:#1f7a36; --ok-soft:rgba(46,160,67,.12);
  --cur-line:#eeeeee; --ln:#6e7681; --ln-active:#171184; --indent:#e3e3e3; --ghost:#b4b4b4; --sel:#add6ff;
  --s-kw:#0000ff; --s-ctrl:#af00db; --s-str:#a31515; --s-esc:#ee0000; --s-com:#008000; --s-num:#098658;
  --s-fn:#795e26; --s-cls:#267f99; --s-var:#001080; --s-const:#0070c1; --s-op:#3b3b3b;
  --br0:#0431fa; --br1:#319331; --br2:#7b3814;
  --star:#b58407; --remote:#005fb8;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font:13px/1.4 var(--font-ui);padding-block:12px;padding-inline:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
kbd{font:11px/1 var(--font-ui);padding:2px 5px;border:1px solid var(--widget-border);border-bottom-width:2px;border-radius:4px;background:var(--widget);color:var(--fg-strong);white-space:nowrap}
code{font-family:var(--font-code)}
:focus-visible{outline:1px solid var(--focus);outline-offset:-1px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 창 ---------- */
.window{position:relative;height:100%;display:grid;grid-template-rows:35px minmax(0,1fr) 22px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--editor);box-shadow:0 18px 50px var(--shadow)}
.titlebar{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:12px;background:var(--chrome);border-bottom:1px solid var(--border);padding:0 12px;color:var(--fg-dim);min-width:0}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-dots{display:flex;gap:7px}
.tb-dots i{width:11px;height:11px;border-radius:50%;background:var(--btn2);display:block}
.tb-app{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-center{display:flex;align-items:center;gap:8px;justify-content:center;height:24px;min-width:0;width:min(420px,40vw);padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--editor);color:var(--fg-dim);font-size:12px;white-space:nowrap;overflow:hidden}
.cmd-center span{overflow:hidden;text-overflow:ellipsis}
.tb-right{justify-self:end;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb-right b{color:var(--fg);font-weight:600}

.main{position:relative;display:grid;grid-template-columns:48px var(--sbw,256px) minmax(0,1fr);min-height:0;min-width:0}
.main.sb-closed{grid-template-columns:48px 0 minmax(0,1fr)}
.main.sb-closed .sidebar{visibility:hidden;border:0}
.ln.mark .code{background:linear-gradient(90deg,var(--ok-soft),transparent 80%)}

/* 활동 막대 */
.activity{display:flex;flex-direction:column;background:var(--chrome);border-right:1px solid var(--border)}
.act{position:relative;height:48px;display:grid;place-items:center;color:var(--fg-faint)}
.act svg.i{width:24px;height:24px;stroke-width:1.2}
.act:hover,.act.on{color:var(--fg-strong)}
.act.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.act-spacer{flex:1}

/* 사이드바 */
.sidebar{background:var(--chrome);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sb-title{height:35px;display:flex;align-items:center;padding:0 20px;font-size:11px;letter-spacing:.04em;color:var(--fg-dim);flex:none}
.sb-section{display:flex;flex-direction:column;min-height:0}
.sb-files{flex:1;overflow:auto}
.sb-head{display:flex;align-items:center;gap:4px;height:22px;padding:0 6px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--fg);border-top:1px solid transparent;flex:none;width:100%;text-align:left}
.sb-head svg.i{width:14px;height:14px;transition:transform .12s}
.sb-head.closed svg.i{transform:rotate(-90deg)}
.tree{padding-bottom:6px}
.row{display:flex;align-items:center;gap:6px;width:100%;height:22px;padding-right:10px;text-align:left;white-space:nowrap;color:var(--fg);border:1px solid transparent}
.row:hover{background:var(--list-hover)}
.row.on{background:var(--list-active)}
.row:focus-visible{outline:1px solid var(--focus);outline-offset:-1px}
.row .tw{flex:none;width:16px;display:grid;place-items:center;color:var(--fg-dim)}
.row .tw svg.i{width:14px;height:14px;transition:transform .12s}
.row.closed .tw svg.i{transform:rotate(-90deg)}
.fname{overflow:hidden;text-overflow:ellipsis;min-width:0}
.fdesc{color:var(--fg-faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.badge{margin-left:auto;flex:none;font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg-dim)}
.badge.ok{color:var(--ok-fg)}
.badge.part{color:var(--warn)}
.ficon{flex:none;width:16px;height:16px;display:grid;place-items:center;font:700 8.5px/1 var(--font-code);color:#519aba;letter-spacing:-.02em}
.ficon.fhome{color:var(--accent-fg)}
.ficon.fhome svg.i{width:14px;height:14px}
.sb-progress{border-top:1px solid var(--border);padding:0 0 12px;flex:none}
.prog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:5px 20px 0;font-size:12px;color:var(--fg-dim)}
.prog .bar{height:4px;border-radius:2px;background:var(--btn2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.prog b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.el-mini{display:flex;flex-wrap:wrap;gap:4px;padding:10px 20px 0}
.el-mini .chip{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--widget-border);color:var(--fg-faint)}
.el-mini .chip.lit{border-color:var(--ok);color:var(--ok-fg);background:var(--ok-soft)}
.el-cap{padding:10px 20px 0;font-size:11px;color:var(--fg-faint)}

/* ---------- 편집기 ---------- */
.editor-group{display:grid;grid-template-rows:35px 22px minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--editor)}
.tabbar{display:flex;align-items:stretch;background:var(--chrome);border-bottom:1px solid var(--border);min-width:0}
.tabs{display:flex;overflow-x:auto;overflow-y:hidden;min-width:0;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;min-width:max-content;border-right:1px solid var(--border);color:var(--fg-dim);background:var(--chrome);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--editor);color:var(--fg-strong)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--editor)}
.tab .tname{font-size:13px}
.tab .tsub{font-size:12px;color:var(--fg-faint)}
.tclose{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--fg-dim);opacity:0}
.tab:hover .tclose,.tab.on .tclose{opacity:1}
.tclose:hover{background:var(--btn2)}
.tclose svg.i{width:14px;height:14px}
.ed-actions{display:flex;align-items:center;gap:4px;padding:0 8px;flex:none}
.eda{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:5px;color:var(--fg);font-size:12px;white-space:nowrap}
.eda:hover{background:var(--btn2)}
.eda.run{color:var(--ok-fg)}
.eda svg.i{width:15px;height:15px}
.crumbs{display:flex;align-items:center;gap:2px;padding:0 12px;font-size:12px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;min-width:0}
.crumbs .sep{opacity:.6;padding:0 3px}
.crumbs .sym{display:inline-flex;align-items:center;gap:4px;color:var(--fg)}
.crumbs .sym i{width:12px;height:12px;border-radius:2px;background:var(--s-ctrl);opacity:.85;display:inline-block}

.editor-wrap{position:relative;min-height:0;min-width:0}
.scroller{position:absolute;inset:0;overflow:auto;font:var(--code-size)/var(--code-lh) var(--font-code);font-variant-ligatures:none;-webkit-font-smoothing:auto;scroll-padding-block:110px 60px}
.lines{width:max-content;min-width:100%;padding-bottom:40vh;position:relative}
.lines.short{padding-bottom:4px}
.ln{display:flex;min-height:var(--code-lh);position:relative}
.gut{position:sticky;left:0;z-index:2;flex:none;width:var(--gut);display:grid;grid-template-columns:18px 1fr 8px;align-items:start;background:var(--editor);color:var(--ln);font-variant-numeric:tabular-nums;user-select:none}
.gut .num{text-align:right;padding-right:6px}
.gut .gly{height:var(--code-lh);display:grid;place-items:center}
.gut .gly svg.i{width:14px;height:14px}
.gut .bar{height:100%;margin-left:3px;width:3px}
.gut .bar.added{background:var(--ok)}
.gut .bar.revealed{background:var(--accent)}
.code{white-space:pre;padding-left:4px;padding-right:48px;cursor:pointer;flex:1;min-width:0}
.ln:not(.cur):not(.blank):hover .code{background:linear-gradient(90deg,var(--cur-line),transparent 80%)}
.ln.given .code{opacity:.78}
.ln.upcoming .code{opacity:.3}
.ln.upcoming .gut .num{opacity:.5}
.ig{box-shadow:inset 1px 0 0 var(--indent)}
.ln.flash .code{animation:sweep .9s ease-out}
@keyframes sweep{0%{background:linear-gradient(90deg,var(--info-soft) 0%,transparent 0%)}35%{background:linear-gradient(90deg,var(--info-soft) 60%,transparent 100%)}100%{background:linear-gradient(90deg,transparent 100%,transparent 100%)}}
.ripple{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--accent-fg);pointer-events:none;animation:ripple .6s ease-out forwards;z-index:3}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(4.5);opacity:0}}

/* 구문 색 */
.s-kw{color:var(--s-kw)}.s-ctrl{color:var(--s-ctrl)}.s-str{color:var(--s-str)}.s-esc{color:var(--s-esc)}.s-com{color:var(--s-com)}
.s-num{color:var(--s-num)}.s-fn{color:var(--s-fn)}.s-cls{color:var(--s-cls)}.s-var{color:var(--s-var)}.s-const{color:var(--s-const)}
.s-op,.ws{color:var(--s-op)}.s-fbr{color:var(--s-kw)}
.br0{color:var(--br0)}.br1{color:var(--br1)}.br2{color:var(--br2)}.br-bad{color:var(--err)}
.sq{text-decoration:underline wavy var(--err);text-decoration-skip-ink:none;text-underline-offset:4px;text-decoration-thickness:1px}

/* 배너 */
.banner{position:sticky;left:0;width:var(--vw);z-index:4;background:var(--editor);border-bottom:1px solid var(--border);font-family:var(--font-ui);padding:10px 16px 0 calc(var(--gut) + 4px)}
.banner.stick{top:0}
.bn-eyebrow{font-size:11px;letter-spacing:.06em;color:var(--fg-faint);text-transform:uppercase}
.bn-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bn-title{font-size:15px;font-weight:600;color:var(--fg-strong);text-wrap:balance}
.bn-goal{font-size:12.5px;color:var(--fg-dim);padding:2px 0 8px;max-width:72ch}
.bn-count{margin-left:auto;font-size:12px;color:var(--fg-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.bn-count b{color:var(--fg-strong);font-weight:600}
.bn-bar{height:2px;margin:0 -16px 0 calc(-1 * (var(--gut) + 4px));background:transparent}
.bn-bar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.bn-keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg-dim);padding-bottom:8px}

/* 따라 쓰기: 편집기 줄 위에 흐린 코드(제안)가 깔리고 그 위에 직접 쓴다 */
.ln.cur{background:var(--cur-line);box-shadow:inset 0 1px 0 var(--border),inset 0 -1px 0 var(--border)}
.ln.cur .gut{background:var(--cur-line);color:var(--ln-active)}
.ln.cur .code{cursor:text;padding-bottom:4px}
.tl{position:relative;display:inline-block;vertical-align:top;height:var(--code-lh);min-width:4ch}
.tm,.ti{position:absolute;inset:0;padding:0;margin:0;border:0;font:inherit;line-height:var(--code-lh);white-space:pre;letter-spacing:0}
.tm{pointer-events:none;overflow:visible}
.ti{width:100%;background:transparent;color:transparent;caret-color:var(--fg-strong);outline:none}
.ti::selection{background:var(--sel);color:transparent}
.ghost{color:var(--ghost)}
.tw-bad{color:#fff;background:var(--err);border-radius:2px}
.tw-comp{text-decoration:underline;text-underline-offset:3px}
.tw-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding-top:3px;max-width:min(80ch,calc(var(--vw) - var(--gut) - 24px));white-space:normal}
.tw-tip{font:12px/1.5 var(--font-ui);color:var(--fg-faint);min-width:0}
.tw-fill{font:11.5px/1 var(--font-ui);color:var(--fg-dim);border:1px solid var(--widget-border);border-radius:4px;padding:3px 7px;background:var(--widget);white-space:nowrap}
.tw-fill:hover{color:var(--fg-strong);border-color:var(--focus)}
.tw-tip.warn{color:var(--warn)}
.tw-tip.err{color:var(--err)}
.tw-tip.ok{color:var(--ok-fg)}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.ln.just .code{animation:lockin .7s ease-out}
@keyframes lockin{0%{background:var(--ok-soft)}100%{background:transparent}}

/* 빈칸 */
.ln.blank{background:linear-gradient(90deg,var(--warn-soft),transparent 70%)}
.ln.blank.wrong{background:linear-gradient(90deg,var(--err-soft),transparent 70%)}
.ln.blank .code{cursor:text;padding-block:2px 3px}
.ln.blank .gly{opacity:0;color:var(--warn)}
.ln.blank:hover .gly,.ln.blank.focus .gly,.ln.blank.wrong .gly{opacity:1}
.bulb{width:18px;height:var(--code-lh);display:grid;place-items:center;border-radius:3px;color:var(--warn)}
.bulb:hover{background:var(--btn2)}
.bw{position:relative;display:inline-block;vertical-align:top;width:var(--w,30ch);min-width:24ch;height:var(--code-lh);border:1px dashed var(--fg-faint);border-radius:3px;background:var(--editor)}
.ln.blank.focus .bw{border:1px solid var(--focus);box-shadow:0 0 0 1px var(--focus)}
.ln.blank.wrong .bw{border-color:var(--err);border-style:solid}
.bm,.bi{position:absolute;inset:0;padding:0 5px;font:inherit;line-height:calc(var(--code-lh) - 2px);white-space:pre;letter-spacing:0;border:0;margin:0}
.bm{overflow:hidden;pointer-events:none}
.bi{width:100%;background:transparent;color:transparent;caret-color:var(--fg-strong);outline:none}
.bi::placeholder{color:var(--fg-faint);font-style:italic;opacity:1}
.bi::selection{background:var(--sel);color:transparent}
.lens{display:block;font:12px/1.5 var(--font-ui);white-space:normal;max-width:min(70ch,calc(var(--vw) - var(--gut) - 24px));padding:3px 8px 1px;margin-top:3px;border-radius:3px}
.lens.error{color:var(--err);background:var(--err-soft)}
.lens.warn{color:var(--warn);background:var(--warn-soft)}
.lens.info{color:var(--info);background:var(--info-soft)}
.lens code{font-size:12px;color:var(--fg-strong)}
.ln.locked .gly{color:var(--ok-fg)}
.ln.locked.rev .gly{color:var(--accent-fg)}

/* 개요 눈금자 */
.ruler{position:absolute;top:0;right:0;bottom:0;width:12px;border-left:1px solid var(--border);z-index:5;background:var(--editor)}
.ruler i{position:absolute;left:2px;right:2px;height:4px;border-radius:1px;cursor:pointer}
.ruler i.empty{background:var(--warn)}.ruler i.wrong{background:var(--err)}.ruler i.correct{background:var(--ok)}.ruler i.revealed{background:var(--accent)}

/* 피크(줄 설명) */
.peek{position:sticky;left:0;width:var(--vw);z-index:3;font-family:var(--font-ui);border-top:2px solid var(--peek-border);border-bottom:2px solid var(--peek-border);background:var(--peek);margin:2px 0 4px;animation:peekin .28s ease-out;white-space:normal}
@keyframes peekin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.peek-head{display:flex;align-items:center;gap:10px;height:26px;padding:0 8px 0 calc(var(--gut) + 4px);background:var(--peek-head);font-size:12px}
.peek-head .pf{color:var(--fg-strong)}
.peek-head .ps{color:var(--fg-dim)}
.peek-x{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--fg-dim)}
.peek-x:hover{background:var(--btn2)}
.peek-body{padding:10px 16px 12px calc(var(--gut) + 4px);display:grid;gap:8px;max-width:calc(var(--gut) + 90ch)}
.p-title{font-size:15px;font-weight:600;color:var(--fg-strong);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-desc{margin:0;font-size:13px;line-height:1.6;color:var(--fg);max-width:70ch}

<script type="text/plain" id="src-step3">
"""
STEP 3. MCP 서버 만들기 — 개인 DB를 다루는 '도구 상자'

이 파일은 직접 실행하는 프로그램이 아닙니다.
에이전트(step4)나 Claude 데스크톱 앱이 이 파일을 실행해서, 안에 있는 도구를 빌려 씁니다.

동작만 먼저 확인하고 싶다면:  python step3_test_server.py

※ 주의: stdio 방식 MCP 서버에서는 print()를 쓰면 안 됩니다.
   표준출력(stdout)이 에이전트와 대화하는 통로라서, print가 끼어들면 통신이 깨집니다.
"""

import sqlite3
from datetime import date, datetime, timedelta
from pathlib import Path

from mcp.server.mcpserver import MCPServer  # mcp 2.x 기준 (1.x의 FastMCP가 MCPServer로 바뀜)

DB_PATH = Path(__file__).parent / "data" / "my_projects.db"

TASK_STATUSES = ["할 일", "진행 중", "완료"]
PROJECT_STATUSES = ["진행 중", "보류", "완료"]
PRIORITIES = ["높음", "보통", "낮음"]

mcp = MCPServer("personal-db")


def connect() -> sqlite3.Connection:
    if not DB_PATH.exists():
        raise FileNotFoundError("DB가 없습니다. 먼저 python step1_setup_db.py 를 실행하세요.")
    conn = sqlite3.connect(DB_PATH)
    conn.row_factory = sqlite3.Row  # 결과를 {컬럼이름: 값} 형태로 받기
    return conn


def rows(cur: sqlite3.Cursor) -> list[dict]:
    return [dict(r) for r in cur.fetchall()]


# ──────────────────────────────────────────────
# 조회 도구 (읽기만 함)
# ──────────────────────────────────────────────

@mcp.tool()
def get_overview() -> dict:
    """오늘 날짜와 전체 현황(프로젝트별 진행률, 기한 지난 할 일, 7일 안에 마감인 할 일)을 한 번에 요약한다.
    사용자가 '요즘 상황', '브리핑', '뭐부터 해야 해?'처럼 전체를 물으면 가장 먼저 사용한다."""
    today = date.today().isoformat()
    week_later = (date.today() + timedelta(days=7)).isoformat()
    with connect() as conn:
        progress = rows(conn.execute(
            """SELECT p.id, p.name, p.status,
                      COUNT(t.id) AS total, COALESCE(SUM(t.status = '완료'), 0) AS done
               FROM projects p LEFT JOIN tasks t ON t.project_id = p.id
               GROUP BY p.id ORDER BY p.id"""))
        overdue = rows(conn.execute(
            """SELECT t.id, p.name AS project, t.title, t.priority, t.due_date
               FROM tasks t JOIN projects p ON p.id = t.project_id
               WHERE t.status != '완료' AND t.due_date < ? ORDER BY t.due_date""", (today,)))
        due_soon = rows(conn.execute(
            """SELECT t.id, p.name AS project, t.title, t.priority, t.due_date
               FROM tasks t JOIN projects p ON p.id = t.project_id
               WHERE t.status != '완료' AND t.due_date BETWEEN ? AND ? ORDER BY t.due_date""",
            (today, week_later)))
    return {"today": today, "projects": progress, "overdue": overdue, "due_within_7_days": due_soon}


@mcp.tool()
def list_projects(status: str | None = None) -> list[dict]:
    """프로젝트 목록을 돌려준다. status로 거를 수 있다('진행 중', '보류', '완료')."""
    sql = "SELECT id, name, description, status, start_date, due_date FROM projects"
    params: tuple = ()
    if status:
        sql += " WHERE status = ?"
        params = (status,)
    with connect() as conn:
        return rows(conn.execute(sql + " ORDER BY id", params))


@mcp.tool()
def list_tasks(
    project_id: int | None = None,
    status: str | None = None,
    due_within_days: int | None = None,
) -> list[dict]:
    """할 일 목록을 돌려준다. 조건은 모두 선택 사항이다.
    - project_id: 특정 프로젝트의 할 일만 (프로젝트 id는 list_projects로 확인)
    - status: '할 일', '진행 중', '완료' 중 하나
    - due_within_days: 오늘부터 N일 안에 마감인 미완료 할 일만 (기한 지난 것 포함)"""
    sql = """SELECT t.id, t.project_id, p.name AS project, t.title, t.status,
                    t.priority, t.due_date, t.done_at
             FROM tasks t JOIN projects p ON p.id = t.project_id WHERE 1=1"""
    params: list = []
    if project_id is not None:
        sql += " AND t.project_id = ?"
        params.append(project_id)
    if status:
        sql += " AND t.status = ?"
        params.append(status)
    if due_within_days is not None:
        limit = (date.today() + timedelta(days=due_within_days)).isoformat()
        sql += " AND t.status != '완료' AND t.due_date <= ?"
        params.append(limit)
    sql += " ORDER BY t.due_date IS NULL, t.due_date"
    with connect() as conn:
        return rows(conn.execute(sql, params))


# ──────────────────────────────────────────────
# 변경 도구 (DB를 바꿈)
# ──────────────────────────────────────────────

@mcp.tool()
def add_task(project_id: int, title: str, due_date: str | None = None, priority: str = "보통") -> dict:
    """프로젝트에 새 할 일을 추가한다. due_date는 'YYYY-MM-DD' 형식, priority는 '높음'/'보통'/'낮음'."""
    if priority not in PRIORITIES:
        return {"error": f"priority는 {PRIORITIES} 중 하나여야 합니다."}
    with connect() as conn:
        if not conn.execute("SELECT 1 FROM projects WHERE id = ?", (project_id,)).fetchone():
            return {"error": f"{project_id}번 프로젝트가 없습니다. list_projects로 id를 확인하세요."}
        cur = conn.execute(
            "INSERT INTO tasks (project_id, title, status, priority, due_date, created_at) "
            "VALUES (?, ?, '할 일', ?, ?, ?)",
            (project_id, title, priority, due_date, date.today().isoformat()),
        )
        conn.commit()
        return {"ok": True, "task_id": cur.lastrowid, "title": title}


@mcp.tool()
def update_task(
    task_id: int,
    status: str | None = None,
    priority: str | None = None,
    due_date: str | None = None,
    title: str | None = None,
) -> dict:
    """할 일의 상태·우선순위·마감일·제목을 바꾼다. 바꿀 항목만 넣으면 된다.
    status를 '완료'로 바꾸면 완료일(done_at)이 오늘로 기록된다."""
    if status and status not in TASK_STATUSES:
        return {"error": f"status는 {TASK_STATUSES} 중 하나여야 합니다."}
    if priority and priority not in PRIORITIES:
        return {"error": f"priority는 {PRIORITIES} 중 하나여야 합니다."}
    changes: dict = {}
    if status:
        changes["status"] = status
        changes["done_at"] = date.today().isoformat() if status == "완료" else None
    if priority:
        changes["priority"] = priority
    if due_date:
        changes["due_date"] = due_date
    if title:
        changes["title"] = title
    if not changes:
        return {"error": "바꿀 항목이 없습니다."}
    sets = ", ".join(f"{k} = ?" for k in changes)
    with connect() as conn:
        cur = conn.execute(f"UPDATE tasks SET {sets} WHERE id = ?", (*changes.values(), task_id))
        conn.commit()
        if cur.rowcount == 0:
            return {"error": f"{task_id}번 할 일이 없습니다."}
    return {"ok": True, "task_id": task_id, "changed": changes}


@mcp.tool()
def delete_task(task_id: int) -> dict:
    """할 일을 영구 삭제한다. 되돌릴 수 없으므로, 완료 처리로 충분한 경우에는 update_task를 쓴다."""
    with connect() as conn:
        row = conn.execute("SELECT title FROM tasks WHERE id = ?", (task_id,)).fetchone()
        if not row:
            return {"error": f"{task_id}번 할 일이 없습니다."}
        conn.execute("DELETE FROM tasks WHERE id = ?", (task_id,))
        conn.commit()
    return {"ok": True, "deleted_task_id": task_id, "title": row["title"]}


@mcp.tool()
def add_project(name: str, description: str = "", due_date: str | None = None) -> dict:
    """새 프로젝트를 만든다. 상태는 '진행 중', 시작일은 오늘로 기록된다."""
    with connect() as conn:
        cur = conn.execute(
            "INSERT INTO projects (name, description, status, start_date, due_date) VALUES (?, ?, '진행 중', ?, ?)",
            (name, description, date.today().isoformat(), due_date),
        )
        conn.commit()
        return {"ok": True, "project_id": cur.lastrowid, "name": name}


if __name__ == "__main__":
    mcp.run()  # 기본값: stdio 방식
</script>

"""
STEP 4. OpenAI Agents SDK로 에이전트 만들고 MCP 서버 연결하기

실행: python step4_agent.py
      나> 뒤에 질문을 입력하면 에이전트가 답합니다. '끝'을 입력하면 종료합니다.

준비: .env 파일에 OPENAI_API_KEY 를 넣어 두세요. (.env.example 참고)

※ 이 단계의 에이전트는 질문마다 새로 생각하기 때문에 앞 대화를 기억하지 못합니다.
   대화 기억, 삭제 승인, 도구 호출 로그는 STEP 5에서 더합니다.
"""

import asyncio
import os
import sys
from datetime import date
from pathlib import Path

from dotenv import load_dotenv
from agents import Agent, Runner
from agents.mcp import MCPServerStdio

load_dotenv()  # .env 파일의 OPENAI_API_KEY 를 환경변수로 불러오기

# API 키 점검: .env가 없거나, 예시 문구를 그대로 두었으면 여기서 멈춘다
api_key = os.getenv("OPENAI_API_KEY", "")
if not api_key.startswith("sk-") or "여기에" in api_key:
    sys.exit("OPENAI_API_KEY를 찾지 못했습니다. 폴더 맨 위에 .env 파일이 있는지, 본인 키(sk-...)를 넣었는지 확인하세요.")

SERVER_PATH = Path(__file__).parent / "step3_mcp_server.py"

INSTRUCTIONS = f"""
너는 사용자의 개인 프로젝트 DB를 관리하는 비서다. 오늘은 {date.today().isoformat()}이다.
- 답하기 전에 반드시 도구로 DB를 조회하고, DB에 없는 내용은 지어내지 않는다.
- 날짜는 'YYYY-MM-DD'로 다루되, 사용자에게는 '3일 남음', '2일 지남'처럼 알려 준다.
- 할 일을 추가하거나 바꾼 뒤에는 무엇이 바뀌었는지 한 줄로 확인해 준다.
- 답변은 한국어로, 짧고 보기 좋게 정리한다.
"""


async def main() -> None:
    # 1) MCP 서버를 '하위 프로세스'로 띄우고 연결한다
    async with MCPServerStdio(
        name="personal-db",
        params={"command": sys.executable, "args": [str(SERVER_PATH)]},
        cache_tools_list=True,  # 도구 목록을 매번 다시 받지 않도록 저장
    ) as db_server:

        # 2) 에이전트 정의: 이름 + 지시문 + (MCP 서버에서 온) 도구
        agent = Agent(
            name="개인 DB 매니저",
            instructions=INSTRUCTIONS,
            mcp_servers=[db_server],
            model=os.getenv("OPENAI_MODEL") or None,  # 비워 두면 SDK 기본 모델 사용
        )

        # 3) 대화 루프: 질문이 들어올 때마다 Runner가 '판단 → 도구 호출 → 결과 확인'을 돌린다
        print("개인 DB 매니저입니다. 무엇을 도와드릴까요? ('끝' 입력 시 종료)")
        while True:
            question = input("\n나> ").strip()
            if question in ("끝", "exit", "quit"):
                break
            if not question:
                continue

            result = await Runner.run(agent, question)
            print(f"\n에이전트> {result.final_output}")


if __name__ == "__main__":
    asyncio.run(main())

<script type="text/plain" id="src-step5">
"""
STEP 5. 대화형 에이전트로 키우기 (바이브코딩 확장 예시)

실행: python step5_agent_chat.py
      종료하려면 '끝' 또는 'exit' 입력

STEP 4에서 세 가지를 더했습니다.
  ① 대화 기억   : SQLiteSession — 앞에서 한 말을 기억한다 ("그거 완료로 바꿔 줘"가 통한다)
  ② 삭제 승인   : require_approval — delete_task 를 부르기 전에 사람에게 y/n 을 묻는다
  ③ 도구 호출 로그 : 에이전트가 어떤 도구를 불렀는지 화면에 보여 준다
"""

import asyncio
import os
import sys
from datetime import date
from pathlib import Path

from dotenv import load_dotenv
from agents import Agent, Runner, SQLiteSession
from agents.mcp import MCPServerStdio

load_dotenv()

# API 키 점검: .env가 없거나, 예시 문구를 그대로 두었으면 여기서 멈춘다
api_key = os.getenv("OPENAI_API_KEY", "")
if not api_key.startswith("sk-") or "여기에" in api_key:
    sys.exit("OPENAI_API_KEY를 찾지 못했습니다. 폴더 맨 위에 .env 파일이 있는지, 본인 키(sk-...)를 넣었는지 확인하세요.")

SERVER_PATH = Path(__file__).parent / "step3_mcp_server.py"
MEMORY_PATH = Path(__file__).parent / "data" / "chat_memory.db"

INSTRUCTIONS = f"""
너는 사용자의 개인 프로젝트 DB를 관리하는 비서다. 오늘은 {date.today().isoformat()}이다.
- 답하기 전에 반드시 도구로 DB를 조회하고, DB에 없는 내용은 지어내지 않는다.
- '그거', '아까 그 일'처럼 가리키는 말은 앞 대화에서 찾아 해석한다. 애매하면 되묻는다.
- 날짜는 'YYYY-MM-DD'로 다루되, 사용자에게는 '3일 남음', '2일 지남'처럼 알려 준다.
- 할 일을 추가하거나 바꾼 뒤에는 무엇이 바뀌었는지 한 줄로 확인해 준다.
- 삭제가 거절되면 완료 처리 같은 다른 방법을 제안한다.
- 답변은 한국어로, 짧고 보기 좋게 정리한다.
"""


def ask_approval(result, state) -> None:
    """에이전트가 승인이 필요한 도구를 부르려 하면, 사람에게 직접 물어본다."""
    for item in result.interruptions:
        answer = input(f"  ⚠ '{item.name}' 실행 요청 {item.arguments} — 허용할까요? (y/n) ").strip().lower()
        if answer == "y":
            state.approve(item)
        else:
            state.reject(item, rejection_message="사용자가 삭제를 거절했습니다.")


def print_tool_calls(result) -> None:
    for item in result.new_items:
        if item.type == "tool_call_item":
            name = getattr(item.raw_item, "name", "도구")
            print(f"  · 도구 호출: {name}")


async def main() -> None:
    session = SQLiteSession("my-session", str(MEMORY_PATH))  # ① 대화 기억

    async with MCPServerStdio(
        name="personal-db",
        params={"command": sys.executable, "args": [str(SERVER_PATH)]},
        cache_tools_list=True,
        require_approval={"delete_task": "always"},  # ② 삭제는 사람 승인 필요
    ) as db_server:
        agent = Agent(
            name="개인 DB 매니저",
            instructions=INSTRUCTIONS,
            mcp_servers=[db_server],
            model=os.getenv("OPENAI_MODEL") or None,
        )

        print("개인 DB 매니저입니다. 무엇을 도와드릴까요? ('끝' 입력 시 종료)")
        while True:
            question = input("\n나> ").strip()
            if question in ("끝", "exit", "quit"):
                break
            if not question:
                continue

            result = await Runner.run(agent, question, session=session)
            while result.interruptions:  # 승인 대기 중이면 물어보고 이어서 실행
                state = result.to_state()
                ask_approval(result, state)
                result = await Runner.run(agent, state, session=session)

            print_tool_calls(result)  # ③ 도구 호출 로그
            print(f"\n에이전트> {result.final_output}")


if __name__ == "__main__":
    asyncio.run(main())

    out.push({ t: '' }); out.push({ t: "에이전트> '이사업체 견적 3곳 받기'예요. 마감이 1일 지났어요." });
    out.push({ t: '' }); out.push({ h: '나> <span class="ta">그거 진행 중으로 바꿔 줘</span>' });
    out.push({ t: '  · 도구 호출: update_task', c: 'td' });
    out.push({ t: '' }); out.push({ t: "에이전트> '이사업체 견적 3곳 받기'를 진행 중으로 바꿨어요." });
    out.push({ t: '' }); out.push({ h: '나> <span class="ta">14번 할 일 지워 줘</span>' });
    out.push({ h: `  <span class="tw">⚠ 'delete_task' 실행 요청 {"task_id": 14} — 허용할까요? (y/n)</span> n` });
    out.push({ t: '  · 도구 호출: delete_task', c: 'td' });
    out.push({ t: '' }); out.push({ t: '에이전트> 삭제는 취소했어요. 대신 완료로 처리할까요?' });

}
let termTimer = 0;
function runFile(f) {
  clearInterval(termTimer);
  UI.term = { lines: runLines(f), shown: 0 };
  UI.panelOpen = true; UI.panelTab = 'terminal'; renderPanel();
  if (RM) { UI.term.shown = UI.term.lines.length; drawTerm(); return; }
  termTimer = setInterval(() => { UI.term.shown++; drawTerm(); if (UI.term.shown >= UI.term.lines.length) clearInterval(termTimer); }, 55);
}

/* ================================================================
   메뉴 · 알림 · 축하 효과
   ================================================================ */
function showMenu(items, x, y, anchor) {
  const m = $('#menu');
  m.innerHTML = items.map((it, i) => it.h ? `<div class="mh">${esc(it.h)}</div>` : it.sep ? '<div class="msep"></div>' : `<button class="mi" role="menuitem" data-mi="${i}">${it.icon ? ic(it.icon) : '<span style="width:15px;flex:none"></span>'}<span class="ml">${esc(it.label)}</span>${it.key ? `<span class="mk">${esc(it.key)}</span>` : ''}</button>`).join('');
  m.hidden = false;
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  m.style.top = (y + r.height > innerHeight - 8 ? Math.max(8, y - r.height - 28) : y) + 'px';
  MENU = { items, anchor };
  $$('.mi', m).forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); const keep = items[+btn.dataset.mi].run(btn); if (!keep) closeMenu(); }));
  m.onkeydown = e => {
    const bs = $$('.mi', m), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeMenu(true); }
  };
  const first = $('.mi', m); if (first) first.focus();
}
function closeMenu(restore) {
  const m = $('#menu'); if (!m || m.hidden) return;
  m.hidden = true;
  if (restore && MENU && MENU.anchor) MENU.anchor.focus();
  MENU = null;
}
function applyTheme() { if (SV.theme) document.documentElement.setAttribute('data-theme', SV.theme); }
function applyFont() {
  const s = document.documentElement.style;
  if (SV.font) { s.setProperty('--code-size', SV.font + 'px'); s.setProperty('--code-lh', Math.round(SV.font * 1.5) + 'px'); }
  else { s.removeProperty('--code-size'); s.removeProperty('--code-lh'); }
}
function curFont() { return SV.font || parseInt(getComputedStyle(document.documentElement).getPropertyValue('--code-size'), 10) || 14; }
function openGear(btn) {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  let armed = false;
  const r = btn.getBoundingClientRect();
  const setFont = d => { SV.font = Math.max(12, Math.min(22, curFont() + d)); persist(); applyFont(); keepScroll(() => renderEditor()); const k = $('#menu .mk'); if (k) k.textContent = SV.font + 'px'; return true; };
  showMenu([
    { h: '색 테마' },
    { icon: light ? null : 'check', label: 'Dark Modern (기본)', run: () => { SV.theme = 'dark'; persist(); applyTheme(); } },
    { icon: light ? 'check' : null, label: 'Light Modern', run: () => { SV.theme = 'light'; persist(); applyTheme(); } },
    { sep: 1 },
    { h: '코드 글자 크기' },
    { icon: 'zin', label: '크게', key: curFont() + 'px', run: () => setFont(1) },
    { icon: 'zout', label: '작게', run: () => setFont(-1) },
    { sep: 1 },
    { icon: 'trash', label: '진행 기록 지우기', run: b => {
      if (!armed) { armed = true; b.querySelector('.ml').textContent = '한 번 더 누르면 모두 지웁니다'; return true; }
      SV.lessons = {}; SV.blanks = {}; SV.seen = {}; persist();
      Object.keys(RUN).forEach(k => delete RUN[k]); Object.keys(BT).forEach(k => delete BT[k]);
      UI.peek = null; UI.term = null; render(); toast('진행 기록을 지웠습니다.');
    } },
  ], r.right + 6, r.top, btn);
}
function toast(msg, o = {}) {
  const box = $('#toasts'); const el = document.createElement('div');
  el.className = 'toast ' + (o.kind || ''); el.setAttribute('role', 'status');
  el.innerHTML = `<span class="t-ic">${ic(o.kind === 'ok' ? 'check' : 'info')}</span><div class="t-msg">${esc(msg)}</div><button class="t-x" aria-label="알림 닫기">${ic('close')}</button>${o.actions ? `<div class="t-act">${o.actions.map((a, i) => `<button class="btn ${i ? 'sec' : ''}" data-ti="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}`;
  el.querySelector('.t-x').addEventListener('click', () => el.remove());
  (o.actions || []).forEach((a, i) => el.querySelector(`[data-ti="${i}"]`).addEventListener('click', () => { el.remove(); a.run(); }));
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), o.actions ? 12000 : 6500);
}
let confettiOn = false;
function confetti() {
  if (RM || confettiOn) return;
  confettiOn = true; setTimeout(() => { confettiOn = false; }, 1500);
  const win = $('#win'); const cv = document.createElement('canvas'); cv.className = 'confetti'; win.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, W = cv.width = win.clientWidth * dpr, H = cv.height = win.clientHeight * dpr;
  const ctx = cv.getContext('2d'); const cs = getComputedStyle(document.documentElement);
  const cols = ['--br0', '--br1', '--br2', '--ok', '--accent-fg'].map(v => cs.getPropertyValue(v).trim() || '#ffd700');
  const glyphs = ['(', ')', '{', '}', '[', ']', ':', '@', '"'];
  const ps = Array.from({ length: 44 }, (_, n) => ({ x: W * (0.35 + Math.random() * 0.3), y: H * 0.6, vx: (Math.random() - 0.5) * 16 * dpr, vy: (-9 - Math.random() * 11) * dpr, s: (9 + Math.random() * 9) * dpr, c: cols[n % cols.length], g: n % 2 ? glyphs[n % glyphs.length] : null, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3 }));
  let t = 0;
  (function step() {
    t++; ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += 0.5 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - t / 80); ctx.fillStyle = p.c;
      if (p.g) { ctx.font = `700 ${p.s * 1.6}px Menlo, Consolas, monospace`; ctx.fillText(p.g, 0, 0); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (t < 80) requestAnimationFrame(step); else cv.remove();
  })();
}

/* ================================================================
   탭 열고 닫기
   ================================================================ */
function saveScroll() { if (UI.active) UI.scroll[UI.active] = [SC().scrollTop, SC().scrollLeft]; }
function openTab(id) {
  if (!UI.tabs.includes(id)) UI.tabs.push(id);
  activate(id);
}
function activate(id) {
  saveScroll(); closeMenu();
  if (UI.active !== id) UI.sym = '';
  UI.active = id;
  if (UI.peek && UI.peek.tab !== id) UI.peek = null;
  render();
  const s = UI.scroll[id];
  if (s && !id.startsWith('lesson:')) { SC().scrollTop = s[0]; SC().scrollLeft = s[1]; }
  else { SC().scrollTop = 0; SC().scrollLeft = 0; }
  if (narrow()) $('#main').classList.add('sb-closed');
}
function closeTab(id) {
  const i = UI.tabs.indexOf(id); if (i < 0) return;
  saveScroll(); UI.tabs.splice(i, 1);
  if (UI.active === id) { UI.active = UI.tabs[i] || UI.tabs[i - 1] || null; }
  render();
  const s = UI.active && UI.scroll[UI.active]; if (s && !UI.active.startsWith('lesson:')) { SC().scrollTop = s[0]; SC().scrollLeft = s[1]; }
}

/* ================================================================
   이벤트
   ================================================================ */
function handleAct(a, e) {
  const act = a.dataset.act;
  if (act !== 'bulb' && act !== 'gear') closeMenu();
  switch (act) {
    case 'open': openTab(a.dataset.tab); break;
    case 'close-tab': e.stopPropagation(); closeTab(a.dataset.tab); break;
    case 'fold': SV.fold[a.dataset.key] = !SV.fold[a.dataset.key]; persist(); renderTree(); break;
    case 'goto-blank': gotoBlank(a.dataset.file, +a.dataset.line); break;
    case 'next-blank': { UI.peek = null; const pk = a.closest('.peek'); if (pk) pk.remove(); focusBlank(a.dataset.blank); break; }
    case 'run': runFile(a.dataset.file); break;
    case 'restart': restartLesson(a.dataset.lesson); break;
    case 'fill-line': { const t = UI.active || ''; if (t.startsWith('lesson:')) { const R = run(LBY[t.slice(7)]); if (R.fill) R.fill(); } break; }
    case 'close-peek': {
      const t = UI.active || '';
      if (t.startsWith('lesson:')) run(LBY[t.slice(7)]).peekAfter = -1; else UI.peek = null;
      const pk = a.closest('.peek'); if (pk) pk.remove();
      const ti = $('#ti'); if (ti) ti.focus({ preventScroll: true });
      break;
    }
    case 'bulb': openQuickFix(BLANK[a.dataset.blank]); break;
    case 'retry-blank': retryBlank(BLANK[a.dataset.blank]); break;
    case 'toggle-sb': $('#main').classList.toggle('sb-closed'); $('#actExplorer').classList.toggle('on', !$('#main').classList.contains('sb-closed')); break;
    case 'gear': if (MENU) closeMenu(); else openGear(a); break;
    case 'problems': if (UI.panelOpen && UI.panelTab === 'problems') UI.panelOpen = false; else { UI.panelOpen = true; UI.panelTab = 'problems'; } renderPanel(); break;
    case 'ptab': UI.panelTab = a.dataset.p; renderPanel(); break;
    case 'close-panel': UI.panelOpen = false; renderPanel(); break;
  }
}
function bindGlobal() {
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) { handleAct(a, e); return; }
    if (!e.target.closest('#menu')) closeMenu();
    if (!e.target.closest('#hover') && !e.target.closest('#scroller')) hideHover();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideHover(); closeMenu(true); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tab')) { e.preventDefault(); openTab(e.target.dataset.tab); }
  });
  const sc = SC();
  sc.addEventListener('click', e => {
    if (e.target.closest('[data-act]')) return;
    if (e.target.closest('input, .peek, .done-card, .banner, .welcome, .empty')) return;
    const ln = e.target.closest('.ln');
    const ti = $('#ti');
    if (!ln) { hideHover(); if (ti) ti.focus({ preventScroll: true }); return; }
    if (ln.classList.contains('cur')) { if (ti) ti.focus(); hideHover(); return; }
    if (ln.classList.contains('blank')) { const bi = ln.querySelector('.bi'); if (bi) bi.focus(); hideHover(); return; }
    const d = curDoc(); if (!d) return;
    const ann = annAt(d.doc, +ln.dataset.i);
    if (!ann) { hideHover(); flash(ln); return; }
    showHover(ln, ann, e);
    if (ti) ti.focus({ preventScroll: true }); else setCursor(+ln.dataset.i + 1, 1);
  });
  sc.addEventListener('scroll', hideHover, { passive: true });
  const ro = new ResizeObserver(() => { sc.style.setProperty('--vw', sc.clientWidth + 'px'); });
  ro.observe(sc);
  sc.style.setProperty('--vw', sc.clientWidth + 'px');
}

/* ================================================================
   시작
   ================================================================ */
function init() {
  document.documentElement.lang = 'ko';
  applyTheme(); applyFont();
  $$('[data-icon]').forEach(el => { el.outerHTML = ic(el.dataset.icon); });
  if (narrow()) { $('#main').classList.add('sb-closed'); $('#actExplorer').classList.remove('on'); }
  bindGlobal();
  const h = (location.hash || '').slice(1);
  if (h === 'typing') { const L = LESSONS.find(x => !(SV.lessons[x.id] && SV.lessons[x.id].done)) || LESSONS[0]; UI.tabs.push('lesson:' + L.id); UI.active = 'lesson:' + L.id; }
  else if (h === 'blanks') { UI.tabs.push('blanks:step3'); UI.active = 'blanks:step3'; }
  render();
  window.addEventListener('resize', () => { if (!narrow()) { /* 넓은 화면에서는 탐색기 상태를 그대로 둔다 */ } });
}
init();
